name: Compile and Test (Windows)

run-name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }} ${{ github.event.inputs.phpts }} + Perl ${{ github.event.inputs.perlversion }}"

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Windows runner image'
        type: choice
        default: 'windows-2022'
        options:
        - 'windows-2022'
        - 'windows-2025'
      phpversion:
        description: 'PHP Version'
        type: choice
        default: 'latest'
        options:
        - 'latest'
        - '8.5'
        - '8.4'
      perlversion:
        description: 'Perl Version (must support the MSVC143 toolset)'
        type: choice
        default: '5.40'
        options:
        - '5.40'
        - '5.38'
        - '5.36'
      phpts:
        description: 'PHP Thread Safety'
        type: choice
        default: 'nts'
        options:
        - 'nts'
        - 'ts'
      runtests:
        description: 'Run Tests'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: "${{ github.event.inputs.os }}"
    name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }} ${{ github.event.inputs.phpts }} + Perl ${{ github.event.inputs.perlversion }}"

    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v6

    - name: 🐘 Set up PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: "${{ github.event.inputs.phpversion }}"
      env:
        phpts: "${{ github.event.inputs.phpts }}"

    - name: 📦 Install PHP Development Pack
      env:
        PHP_VERSION: "${{ steps.setup-php.outputs.php-version }}"
        PHP_PHPTS: "${{ github.event.inputs.phpts }}"
        GITHUB_TOKEN: "${{ github.token }}"
      shell: pwsh
      run: |
        # Resolve the PHP development pack asset for this PHP version
        $phpVersion = $env:PHP_VERSION
        $thread = if ($env:PHP_PHPTS -eq 'ts') { 'ts' } else { 'nts' }
        $major = $phpVersion -replace '^(\d+\.\d+)\..*', '$1'
        $release = Invoke-RestMethod "https://api.github.com/repos/shivammathur/php-builder-windows/releases/tags/php$major" -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
        $exact = $release.assets.name | Where-Object { $_ -match "^php-devel-pack-$([regex]::Escape($phpVersion))-$thread-Win32-vs\d+-x64\.zip$" }
        $candidate = if ($exact) { $exact } else {
          $release.assets.name | Where-Object { $_ -match "^php-devel-pack-[^-]*-$thread-Win32-vs\d+-x64\.zip$" } | Select-Object -Last 1
        }
        if (-not $candidate) { throw "No matching PHP development pack found for PHP $phpVersion ($thread)" }
        Write-Host "`e[32m√`e[0m Using PHP development pack: $candidate"

        # Download the development pack
        $zip = Join-Path $env:RUNNER_TEMP $candidate
        Invoke-WebRequest "https://github.com/shivammathur/php-builder-windows/releases/download/php$major/$candidate" -OutFile $zip
        Write-Host "`e[32m√`e[0m PHP development pack downloaded to $zip"

        # Locate the PHP installation directory
        $phpExe = (Get-Command php.exe -ErrorAction SilentlyContinue).Source
        if (-not $phpExe) { $phpExe = 'C:\tools\php\php.exe' }
        if (-not (Test-Path $phpExe)) { throw 'php.exe not found' }
        $PHP_PREFIX = Split-Path $phpExe

        # Extract the pack and promote its contents into the PHP directory
        Expand-Archive -Path $zip -DestinationPath $PHP_PREFIX -Force
        $develRoot = Get-ChildItem -Path $PHP_PREFIX -Directory -Filter 'php-*devel*' | Select-Object -First 1
        if (-not $develRoot) { throw "PHP devel pack root not found under $PHP_PREFIX" }
        Get-ChildItem -Path $develRoot.FullName | Copy-Item -Destination $PHP_PREFIX -Recurse -Force
        Remove-Item -Path $develRoot.FullName -Recurse -Force
        Write-Host "`e[32m√`e[0m PHP development pack extracted to $PHP_PREFIX"

        # Verify the pack layout and export the prefix for later steps
        if (-not (Test-Path (Join-Path $PHP_PREFIX 'include\main\php.h'))) { throw 'PHP headers not promoted to include\main' }
        if (-not (Test-Path (Join-Path $PHP_PREFIX 'phpize.bat'))) { throw 'phpize.bat not found in development pack' }
        Add-Content -Path $env:GITHUB_ENV -Value "PHP_PREFIX=$PHP_PREFIX"
        Write-Host "`e[32m√`e[0m PHP development pack layout verified"

    - name: 🔧 Install MSYS2 build tools
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        release: false
        update: true
        install: >-
          bison
          sed
          re2c

    - name: 🛤️ Add MSYS2 tools to PATH
      shell: pwsh
      run: |
        Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\usr\bin"

    - name: 🛠️ Set up MSVC command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 🧭 Ensure MSVC tools precede MSYS2 on PATH
      shell: pwsh
      run: |
        $env:PATH -split ';' |
          Where-Object { $_ -match 'Microsoft Visual Studio|Windows Kits' } |
          ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }

    - name: 🏷️ Resolve Perl release tag
      env:
        PERL_VERSION: "${{ github.event.inputs.perlversion }}"
      shell: pwsh
      run: |
        $version = $env:PERL_VERSION
        $tag = git ls-remote --tags --refs https://github.com/Perl/perl5.git "v$version*" |
          ForEach-Object { ($_ -split "`t")[1] -replace '^refs/tags/', '' } |
          Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
          Sort-Object { [version]($_.Substring(1)) } -Descending |
          Select-Object -First 1
        if (-not $tag) { throw "No perl-$version release tag found" }
        Write-Host "Selected Perl release tag: $tag"
        Add-Content -Path $env:GITHUB_ENV -Value "PERL_VERSION_TAG=$tag"

    - name: 🐪 Checkout Perl
      uses: actions/checkout@v6
      with:
        repository: Perl/perl5
        ref: ${{ env.PERL_VERSION_TAG }}
        path: perl-src
        fetch-depth: 1

    - name: 🏗️ Build MSVC Perl
      shell: pwsh
      run: |
        $srcDir = Join-Path $env:GITHUB_WORKSPACE 'perl-src'
        $makefile = Join-Path $srcDir 'win32\Makefile'
        (Get-Content $makefile) -replace '^#CCTYPE\t+= MSVC143', "CCTYPE`t`t= MSVC143" | Set-Content $makefile

        $prefix = Join-Path $env:RUNNER_TEMP 'perl-msvc'
        Push-Location (Join-Path $srcDir 'win32')
        try {
          nmake INST_TOP=$prefix
          if ($LASTEXITCODE -ne 0) { throw 'nmake failed' }
          nmake installbare INST_TOP=$prefix
          if ($LASTEXITCODE -ne 0) { throw 'nmake installbare failed' }
        } finally {
          Pop-Location
        }

        if (-not (Test-Path (Join-Path $prefix 'lib\CORE\EXTERN.h'))) { throw 'Perl headers not installed to lib\CORE' }

        Add-Content -Path $env:GITHUB_ENV -Value "PERL_PREFIX=$prefix"
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $prefix 'bin')
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $prefix 'lib\CORE')

    - name: ℹ️ Establish OS, PHP and Perl Versions
      shell: pwsh
      run: |
        [System.Environment]::OSVersion.VersionString
        php -v
        perl -v | Select-Object -First 2

    - name: ⚙️ Configure PHP Perl Extension
      shell: cmd
      run: |
        "%PHP_PREFIX%\phpize.bat" && .\configure.bat --with-perl="%PERL_PREFIX%" --with-prefix="%PHP_PREFIX%"

    - name: 🏗️ Build Extension
      shell: cmd
      run: |
        nmake

    - name: 🧪 Test Extension for Functionality
      if: ${{ github.event.inputs.runtests == 'true' }}
      shell: cmd
      run: |
        SET TEST_PHP_ARGS=-q -n
        nmake test

