name: Compile and Test (Matrix)

on:
  workflow_dispatch:
    inputs:
      matrix-size:
        description: 'Test matrix: full or quick'
        type: choice
        default: full
        required: true
        options:
          - full
          - quick
      os:
        description: 'OS'
        type: choice
        default: ubuntu-latest
        required: true
        options:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
      runvalgrind:
        description: 'Run Tests with Memory Check'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: "${{ inputs.os }}"
    name: "${{ inputs.os }} | PHP ${{ matrix.php-version }}"
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.matrix-size == 'quick' && '["7.4","8.0","8.5"]' || '["7.4","8.0","8.1","8.2","8.3","8.4","8.5","8.6"]') }}

    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v7

    - name: 🐘 Set up PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: "${{ matrix.php-version }}"
        tools: phpize, php-config

    - name: 🐪 Install Perl Development
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libperl-dev

    - name: ℹ️ Establish OS, PHP and Perl Versions
      run: |
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        php-config --version
        perl -v | head -n 2

    - name: ⚙️ Configure PHP Perl Extension
      id: configure
      run: |
        phpize
        ./configure --with-perl=/usr --with-php-config="$(command -v php-config)"

    - name: 🏗️ Build Extension
      id: build
      run: make

    - name: ❌ Report Compilation Failure
      if: ${{ failure() && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure') }}
      run: echo "::error::PHP ${{ matrix.php-version }} failed compilation"

    - name: 🧪 Test Extension for Functionality
      id: test_func
      env:
        TEST_PHP_ARGS: '-q'
      run: make test

    - name: 🛠️ Setup valgrind and suppressions
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends valgrind
        valgrind --version
        # Suppressions are only needed on PHP < 8.1
        if php -r "exit(version_compare(PHP_VERSION, '8.1.0', '<') ? 0 : 1);"; then
          # Resolve real PHP binary path and patch suppressions
          PHP_BIN="$(readlink -f "$(command -v php)")"
          sed "s|obj:/usr/bin/php|obj:$PHP_BIN|g" php_perl.supp > php_perl_fixexe.supp
          echo "VALGRIND_OPTS=--suppressions=$PWD/php_perl_fixexe.supp" >> "$GITHUB_ENV"
        fi

    - name: 🔍 Test Extension for Memory Leaks
      id: test_valgrind
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      env:
        TEST_PHP_ARGS: '-m -q'
      run: make test

    - name: 📤 Upload Test Failure Artifacts
      if: ${{ failure() && (steps.test_func.outcome == 'failure' || steps.test_valgrind.outcome == 'failure') }}
      uses: actions/upload-artifact@v7
      with:
        name: test-failures-${{ inputs.os || github.event.inputs.os }}-php${{ matrix.php-version }}
        path: |
          tests/*.diff
          tests/*.out
          tests/*.log
          tests/*.exp
          tests/*.sh
          tests/*.php
          tests/*.mem
        if-no-files-found: ignore

    - name: ❗ Report Generic Failure
      if: ${{ failure() && steps.configure.outcome != 'failure' && steps.build.outcome != 'failure' && steps.test_func.outcome != 'failure' && steps.test_valgrind.outcome != 'failure' }}
      run: echo "::error::PHP ${{ matrix.php-version }} failed"

    - name: 🎉 Report Success
      if: success()
      run: echo "::notice::PHP ${{ matrix.php-version }} passed"
