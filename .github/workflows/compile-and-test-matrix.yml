name: Compile and Test (Matrix)

on:
  workflow_dispatch:
    inputs:
      matrix-size:
        description: 'Test matrix: full or quick'
        type: choice
        default: full
        required: true
        options:
          - full
          - quick
      os:
        description: 'OS'
        type: choice
        default: ubuntu-latest
        required: true
        options:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm

permissions:
  contents: read

jobs:
  build:
    runs-on: "${{ inputs.os }}"
    name: "${{ inputs.os }} | PHP ${{ matrix.php-version }}"
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.matrix-size == 'quick' && '["7.4","8.0","8.5"]' || '["7.4","8.0","8.1","8.2","8.3","8.4","8.5","8.6"]') }}

    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v7

    - name: 🐘 Set up PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: "${{ matrix.php-version }}"
        tools: phpize, php-config

    - name: 🐪 Install Perl Development
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq libperl-dev

    - name: ℹ️ Establish OS, PHP and Perl Versions
      run: |
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        php-config --version
        perl -v | head -n 2

    - name: ⚙️ Configure PHP Perl Extension
      id: configure
      run: |
        phpize
        ./configure --with-perl=/usr --with-php-config="$(command -v php-config)"

    - name: 🏗️ Build Extension
      id: build
      run: make

    - name: ❌ Report Compilation Failure
      if: ${{ failure() && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure') }}
      run: echo "::error::PHP ${{ matrix.php-version }} failed compilation"

    - name: 🧪 Test Extension for Functionality
      id: test
      env:
        TEST_PHP_ARGS: '-q'
      run: make test

    - name: 📄 Show Test Outputs on Failure
      if: ${{ failure() && steps.test.outcome == 'failure' }}
      run: |
        echo "::error::PHP ${{ matrix.php-version }} failed tests"
        for f in tests/*.out; do
          [ -e "$f" ] || continue
          if grep -q -- '--XFAIL--' "${f%.out}.phpt" 2>/dev/null; then
            continue
          fi
          echo "===== $f ====="
          cat "$f"
          echo
        done

    - name: ❗ Report Generic Failure
      if: ${{ failure() && steps.configure.outcome != 'failure' && steps.build.outcome != 'failure' && steps.test.outcome != 'failure' }}
      run: echo "::error::PHP ${{ matrix.php-version }} failed"

    - name: 🎉 Report Success
      if: success()
      run: echo "::notice::PHP ${{ matrix.php-version }} passed"
