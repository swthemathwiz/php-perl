name: Compile and Test (Fedora)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Fedora OS version'
        type: choice
        default: 'fedora:latest'
        options:
        - 'fedora:latest'
        - 'fedora:44'
        - 'fedora:43'
        - 'fedora:42'
      phpversion:
        description: 'PHP Version (informational only - Fedora ships a single distro PHP)'
        type: choice
        default: 'distro'
        options:
        - 'distro'
        - '7.4'
        - '8.0'
        - '8.1'
        - '8.2'
        - '8.3'
        - '8.4'
        - '8.5'
      runtests:
        description: 'Run Tests'
        type: boolean
        default: true
        required: true
      runvalgrind:
        description: 'Run Tests with Memory Check'
        type: boolean
        default: false
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: "${{ github.event.inputs.os }}"

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install PHP and Perl Development
      run: |
        dnf install -y php-cli php-devel perl-devel make gcc
    - name: Establish OS, PHP and Perl Versions
      run: |
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        perl -v | head -n 2
    - name: Configure PHP Perl Extension
      env:
        PHP_PREFIX: "/usr"
        PERL_PREFIX: "/usr"
      run: |
        $PHP_PREFIX/bin/phpize
        ./configure --with-perl=$PERL_PREFIX --with-php-config=$PHP_PREFIX/bin/php-config
        perl -pi -e 's/(\/run-tests\.php )/$1-q /' Makefile
    - name: Build
      run: make
    - name: Test Extension for Functionality
      if: ${{ github.event.inputs.runtests == 'true' }}
      run: make test
    - name: Install valgrind
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        dnf install -y valgrind
        valgrind --version
    - name: Setup Memory Check Suppression File
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        cat php_perl.supp > php_perl_fixexe.supp
        echo "--suppressions=$PWD/php_perl_fixexe.supp" > ~/.valgrindrc
    - name: Test Extension for Memory Leaks
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        perl -pi -e 's/(\/run-tests\.php )/$1-m /' Makefile
        make test
