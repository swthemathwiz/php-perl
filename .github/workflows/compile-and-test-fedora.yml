name: Compile and Test (Fedora)

run-name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }}"

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Fedora OS version'
        type: choice
        default: 'fedora:latest'
        options:
        - 'fedora:latest'
        - 'fedora:44'
        - 'fedora:43'
        - 'fedora:42'
      phpversion:
        description: 'PHP Version (informational only - Fedora ships a single distro PHP)'
        type: choice
        default: 'distro'
        options:
        - 'distro'
        - '8.5'
        - '8.4'
        - '8.3'
        - '8.2'
        - '8.1'
        - '8.0'
        - '7.4'
      runtests:
        description: 'Run Tests'
        type: boolean
        default: true
        required: true
      runvalgrind:
        description: 'Run Tests with Memory Check'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }}"
    container: "${{ github.event.inputs.os }}"

    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v6
    - name: 🐘 Install PHP and Perl Development
      run: |
        dnf install -y php-cli php-devel perl-devel make gcc perl-ExtUtils-Embed
    - name: ℹ️ Establish OS, PHP and Perl Versions
      run: |
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        perl -v | head -n 2
    - name: ⚙️ Configure PHP Perl Extension
      env:
        PHP_PREFIX: "/usr"
        PERL_PREFIX: "/usr"
      run: |
        $PHP_PREFIX/bin/phpize
        ./configure --with-perl=$PERL_PREFIX --with-php-config=$PHP_PREFIX/bin/php-config
    - name: 🏗️ Build Extension
      run: make
    - name: 🧪 Test Extension for Functionality
      if: ${{ github.event.inputs.runtests == 'true' }}
      env:
        TEST_PHP_ARGS: '-q'
      run: make test
    - name: 🛠️ Setup valgrind and suppressions
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        dnf install -y valgrind
        valgrind --version
        cat php_perl.supp > php_perl_fixexe.supp
        echo "VALGRIND_OPTS=--suppressions=$PWD/php_perl_fixexe.supp" >> "$GITHUB_ENV"
    - name: 🔍 Test Extension for Memory Leaks
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      env:
        TEST_PHP_ARGS: '-m -q'
      run: make test
