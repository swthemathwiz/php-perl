name: Compile and Test (Fedora)

run-name: "${{ github.event.inputs.os }} | PHP-distro"

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Fedora OS version'
        type: choice
        default: 'fedora:latest'
        options:
        - 'fedora:latest'
        - 'fedora:44'
        - 'fedora:43'
        - 'fedora:42'
      runtests:
        description: 'Run Tests'
        type: boolean
        default: true
        required: true
      runvalgrind:
        description: 'Run Tests with Memory Check'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: "${{ github.event.inputs.os }} | PHP-distro"
    container: "${{ github.event.inputs.os }}"

    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v7

    - name: 🐘 Install PHP and Perl Development
      run: |
        dnf install -y php-cli php-devel perl-devel make gcc perl-ExtUtils-Embed

    - name: ℹ️ Establish OS, PHP and Perl Versions
      run: |
        . /etc/os-release
        echo "RESOLVED_OS=${ID}-${VERSION_ID}" >> "$GITHUB_ENV"
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        perl -v | head -n 2

    - name: ⚙️ Configure PHP Perl Extension
      env:
        PHP_PREFIX: "/usr"
        PERL_PREFIX: "/usr"
      run: |
        $PHP_PREFIX/bin/phpize
        ./configure --with-perl=$PERL_PREFIX --with-php-config=$PHP_PREFIX/bin/php-config

    - name: 🏗️ Build Extension
      run: make

    - name: 🧪 Test Extension for Functionality
      id: test_func
      if: ${{ github.event.inputs.runtests == 'true' }}
      env:
        TEST_PHP_ARGS: '-q'
      run: make test

    - name: 🛠️ Setup valgrind and suppressions
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        dnf install -y valgrind
        valgrind --version
        cat php_perl.supp > php_perl_fixexe.supp
        echo "VALGRIND_OPTS=--suppressions=$PWD/php_perl_fixexe.supp" >> "$GITHUB_ENV"

    - name: 🔍 Test Extension for Memory Leaks
      id: test_valgrind
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      env:
        TEST_PHP_ARGS: '-m -q'
      run: make test

    - name: 📤 Upload Test Failure Artifacts
      if: ${{ failure() && (steps.test_func.outcome == 'failure' || steps.test_valgrind.outcome == 'failure') }}
      uses: actions/upload-artifact@v7
      with:
        name: test-failures-${{ env.RESOLVED_OS }}-php-distro
        path: |
          tests/*.diff
          tests/*.out
          tests/*.log
          tests/*.exp
          tests/*.sh
          tests/*.php
          tests/*.mem
        if-no-files-found: ignore
