name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.21.5). Tag v<version> must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: 🏷️ Resolve version and tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VER="${{ github.event.inputs.version }}"
          TAG="v${VER}"
        else
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
        fi
        echo "VER=$VER" >> "$GITHUB_ENV"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        echo "Trigger: ${{ github.event_name }}, VER=$VER, TAG=$TAG"

    - name: 📥 Checkout Extension
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ env.TAG }}

    - name: 🐘 Install PHP and Perl Development
      run: |
        sudo apt-get install -qq php php-dev libperl-dev

    - name: 🔎 Check version matches php_perl.h
      run: |
        header_version=$(sed -n 's/^#define PHP_PERL_VERSION "\([^"]*\)".*/\1/p' php_perl.h)
        if [ "$header_version" != "$VER" ]; then
          echo "::error::php_perl.h version '$header_version' does not match tag version '$VER'" >&2
          exit 1
        fi
        echo "Version OK: $VER"

    - name: ⚙️ Configure PHP Perl Extension
      run: |
        /usr/bin/phpize
        ./configure --with-perl=/usr --with-php-config=/usr/bin/php-config

    - name: 🏗️ Build Extension
      run: make

    - name: 🧪 Test Extension for Functionality
      env:
        TEST_PHP_ARGS: '-q'
      run: |
        make test

    - name: 📦 Generate source tarball and checksum
      run: |
        git archive --format=tar.gz --prefix=php_perl-$TAG/ -o php_perl-$TAG-src.tgz "$TAG"
        sha256sum php_perl-$TAG-src.tgz > php_perl-$TAG-src.tgz.sha256
        ls -la php_perl-$TAG-src.tgz*

    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG }}
        files: |
          php_perl-${{ env.TAG }}-src.tgz
          php_perl-${{ env.TAG }}-src.tgz.sha256
        generate_release_notes: true
        fail_on_unmatched_files: true
        name: PHP Perl ${{ env.VER }}
