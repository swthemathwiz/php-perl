name: Compile and Test

run-name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }}"

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        type: choice
        default: 'ubuntu-latest'
        options:
        - 'ubuntu-latest'
        - 'ubuntu-26.04'
        - 'ubuntu-24.04'
        - 'ubuntu-22.04'
      phpversion:
        description: 'PHP Version (choose "distro" for the OS default)'
        type: choice
        default: 'distro'
        options:
        - 'distro'
        - '8.5'
        - '8.4'
        - '8.3'
        - '8.2'
        - '8.1'
      runtests:
        description: 'Run Tests'
        type: boolean
        default: true
        required: true
      runvalgrind:
        description: 'Run Tests with Memory Check'
        type: boolean
        default: true
        required: true

jobs:
  build:
    runs-on: "${{ github.event.inputs.os }}"
    name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }}"
    
    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v6
    - name: 🐘 Install PHP and Perl Development
      env:
        PHP_VERSION: "${{ github.event.inputs.phpversion }}"
      run: |
        if [ "$PHP_VERSION" = "distro" ]; then
          PHP_SUFFIX=""
        else
          PHP_SUFFIX="$PHP_VERSION"
        fi
        sudo apt-get install -qq "php$PHP_SUFFIX" "php$PHP_SUFFIX-dev" libperl-dev
        if [ "$PHP_VERSION" != "distro" ]; then
          sudo update-alternatives --set php "/usr/bin/php$PHP_VERSION"
          sudo update-alternatives --set phar "/usr/bin/phar$PHP_VERSION"
          sudo update-alternatives --set phar.phar "/usr/bin/phar.phar$PHP_VERSION"
          sudo update-alternatives --set phpize "/usr/bin/phpize$PHP_VERSION"
          sudo update-alternatives --set php-config "/usr/bin/php-config$PHP_VERSION"
          sudo update-alternatives --set phpdbg "/usr/bin/phpdbg$PHP_VERSION"
        fi
        echo "PHP_VERSION_SUFFIX=$PHP_SUFFIX" >> "$GITHUB_ENV"
    - name: ℹ️ Establish OS, PHP and Perl Versions
      run: |
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        perl -v | head -n 2
    - name: ⚙️ Configure PHP Perl Extension
      env:
        PHP_PREFIX: "/usr"
        PERL_PREFIX: "/usr"
      run: |
        $PHP_PREFIX/bin/phpize
        ./configure --with-perl=$PERL_PREFIX --with-php-config=$PHP_PREFIX/bin/php-config
    - name: 🏗️ Build Extension
      run: make
    - name: 🧪 Test Extension for Functionality
      if: ${{ github.event.inputs.runtests == 'true' }}
      env:
        TEST_PHP_ARGS: '-q'
      run: |
        make test
    - name: 🛠️ Setup valgrind and suppressions
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      env:
        PHP_BIN: "/usr/bin/php${{ env.PHP_VERSION_SUFFIX }}"
      run: |
        sudo apt-get install -qq valgrind
        valgrind --version
        # Patch PHP executable name
        cat php_perl.supp | perl -p -e "s#obj:/usr/bin/php#obj:$PHP_BIN#" > php_perl_fixexe.supp
        echo "VALGRIND_OPTS=--suppressions=$PWD/php_perl_fixexe.supp" >> "$GITHUB_ENV"
    - name: 🔍 Test Extension for Memory Leaks
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      env:
        TEST_PHP_ARGS: '-m -q'
      run: |
        make test
