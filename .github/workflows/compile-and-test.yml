name: Compile and Test

run-name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }}"

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS'
        type: choice
        default: 'ubuntu-latest'
        options:
        - 'ubuntu-latest'
        - 'ubuntu-26.04'
        - 'ubuntu-24.04'
        - 'ubuntu-22.04'
      phpversion:
        description: 'PHP Version (choose "distro" for the OS default)'
        type: choice
        default: 'distro'
        options:
        - 'distro'
        - '8.5'
        - '8.4'
        - '8.3'
        - '8.2'
        - '8.1'
      runtests:
        description: 'Run Tests'
        type: boolean
        default: true
        required: true
      runvalgrind:
        description: 'Run Tests with Memory Check'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: "${{ github.event.inputs.os }}"
    name: "${{ github.event.inputs.os }} | PHP ${{ github.event.inputs.phpversion }}"
    
    steps:
    - name: 📥 Checkout Extension
      uses: actions/checkout@v7

    - name: 🐘 Install PHP and Perl Development
      env:
        PHP_VERSION: "${{ github.event.inputs.phpversion }}"
      run: |
        sudo apt-get update -qq
        if [ "$PHP_VERSION" = "distro" ]; then
          PHP_SUFFIX=""
        else
          PHP_SUFFIX="$PHP_VERSION"
        fi
        if ! sudo apt-get install -y -qq --no-install-recommends "php$PHP_SUFFIX" "php$PHP_SUFFIX-dev" libperl-dev; then
          echo "::error::Failed to install PHP $PHP_VERSION"
          exit 1
        fi
        if [ "$PHP_VERSION" != "distro" ]; then
          sudo update-alternatives --set php "/usr/bin/php$PHP_VERSION"
          sudo update-alternatives --set phar "/usr/bin/phar$PHP_VERSION"
          sudo update-alternatives --set phar.phar "/usr/bin/phar.phar$PHP_VERSION"
          sudo update-alternatives --set phpize "/usr/bin/phpize$PHP_VERSION"
          sudo update-alternatives --set php-config "/usr/bin/php-config$PHP_VERSION"
          sudo update-alternatives --set phpdbg "/usr/bin/phpdbg$PHP_VERSION"
        fi
        echo "PHP_VERSION_SUFFIX=$PHP_SUFFIX" >> "$GITHUB_ENV"

    - name: ℹ️ Establish OS, PHP and Perl Versions
      run: |
        . /etc/os-release
        echo "RESOLVED_OS=${ID}-${VERSION_ID}" >> "$GITHUB_ENV"
        grep PRETTY_NAME /etc/os-release
        php -v
        phpize --version
        perl -v | head -n 2

    - name: ⚙️ Configure PHP Perl Extension
      env:
        PHP_PREFIX: "/usr"
        PERL_PREFIX: "/usr"
      run: |
        $PHP_PREFIX/bin/phpize
        ./configure --with-perl=$PERL_PREFIX --with-php-config=$PHP_PREFIX/bin/php-config

    - name: 🏗️ Build Extension
      run: make

    - name: 🧪 Test Extension for Functionality
      id: test_func
      if: ${{ github.event.inputs.runtests == 'true' }}
      env:
        TEST_PHP_ARGS: '-q'
      run: |
        make test

    - name: 🛠️ Setup valgrind and suppressions
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends valgrind
        valgrind --version
        # Suppressions are only needed on PHP < 8.1
        if php -r "exit(version_compare(PHP_VERSION, '8.1.0', '<') ? 0 : 1);"; then
          # Resolve real PHP binary path and patch suppressions
          PHP_BIN="$(readlink -f "$(command -v php)")"
          sed "s|obj:/usr/bin/php|obj:$PHP_BIN|g" php_perl.supp > php_perl_fixexe.supp
          echo "VALGRIND_OPTS=--suppressions=$PWD/php_perl_fixexe.supp" >> "$GITHUB_ENV"
        fi

    - name: 🔍 Test Extension for Memory Leaks
      id: test_valgrind
      if: ${{ github.event.inputs.runvalgrind == 'true' }}
      env:
        TEST_PHP_ARGS: '-m -q'
      run: make test

    - name: 📤 Upload Test Failure Artifacts
      if: ${{ failure() && (steps.test_func.outcome == 'failure' || steps.test_valgrind.outcome == 'failure') }}
      uses: actions/upload-artifact@v7
      with:
        name: test-failures-${{ env.RESOLVED_OS }}-php${{ github.event.inputs.phpversion }}
        path: |
          tests/*.diff
          tests/*.out
          tests/*.log
          tests/*.exp
          tests/*.sh
          tests/*.php
          tests/*.mem
        if-no-files-found: ignore
